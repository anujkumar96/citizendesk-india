
name: Deploy CitizenDesk India to GitHub Pages

on:
  push:
    branches:
      - github-pages
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate locale messages
        run: npm run validate:locales

      - name: Lint
        run: npm run lint

      - name: Build static site
        run: npm run build -- --webpack
        env:
          NEXT_PUBLIC_GITHUB_PAGES: "true"
          NEXT_PUBLIC_SITE_URL: "https://anujkumar96.github.io/citizendesk-india"

      - name: Verify static export
        run: |
          if [ ! -d out ]; then
            echo "Static export directory out/ is missing" >&2
            exit 1
          fi
          if [ ! -f out/index.html ]; then
            echo "Static export entry out/index.html is missing" >&2
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}